<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Brick Hill</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101418;
        color: #f4efe6;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100%;
      }
      #game {
        width: min(100vw, calc(100vh * 256 / 240));
        height: min(100vh, calc(100vw * 240 / 256));
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
